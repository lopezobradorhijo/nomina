<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anonimizador Nómina</title>
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #2563eb;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: #3f3f46;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      text-align: center;
    }
    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 15px;
      margin-bottom: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #252528;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .checkbox-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }
    textarea {
      width: 100%;
      background: #252528;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 0.9rem;
      box-sizing: border-box;
      resize: vertical;
    }
    .upload-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
    }
    input[type="file"] {
      display: none;
    }
    #estado {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #10b981;
      text-align: center;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Configurar Censura de Nómina</h1>

    <div class="section-title">Datos a eliminar:</div>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chkDni" checked> D.N.I.
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkCif" checked> CIF / NIF de Empresa
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkTrabajador" checked> Nombre y Apellidos (Trabajador)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkAfiliacion" checked> Nº Afiliación S.S.
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkInscripcion" checked> Nº Inscripción S.S. (C.C.C.)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkNro" checked> Nº Empleado / Matrícula (NRO.)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkCeco"> Centro de Coste (CECO)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkIban" checked> Cuenta Bancaria (IBAN)
      </label>
    </div>

    <div class="section-title">Textos adicionales específicos (opcional):</div>
    <textarea id="textosExtra" rows="2" placeholder="Tu calle o cualquier otro dato personal..."></textarea>

    <label class="upload-btn" for="inputPdf">
      Seleccionar Nómina y Anonimizar
    </label>
    <input type="file" id="inputPdf" accept="application/pdf">

    <div id="estado"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const inputPdf = document.getElementById('inputPdf');
    const estado = document.getElementById('estado');
    const textosExtra = document.getElementById('textosExtra');
    const chkDni = document.getElementById('chkDni');
    const chkCif = document.getElementById('chkCif');
    const chkTrabajador = document.getElementById('chkTrabajador');
    const chkAfiliacion = document.getElementById('chkAfiliacion');
    const chkInscripcion = document.getElementById('chkInscripcion');
    const chkNro = document.getElementById('chkNro');
    const chkCeco = document.getElementById('chkCeco');
    const chkIban = document.getElementById('chkIban');

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('censura_textos') !== null) textosExtra.value = localStorage.getItem('censura_textos');
      if (localStorage.getItem('censura_dni') !== null) chkDni.checked = localStorage.getItem('censura_dni') === 'true';
      if (localStorage.getItem('censura_cif') !== null) chkCif.checked = localStorage.getItem('censura_cif') === 'true';
      if (localStorage.getItem('censura_trabajador') !== null) chkTrabajador.checked = localStorage.getItem('censura_trabajador') === 'true';
      if (localStorage.getItem('censura_afiliacion') !== null) chkAfiliacion.checked = localStorage.getItem('censura_afiliacion') === 'true';
      if (localStorage.getItem('censura_inscripcion') !== null) chkInscripcion.checked = localStorage.getItem('censura_inscripcion') === 'true';
      if (localStorage.getItem('censura_nro') !== null) chkNro.checked = localStorage.getItem('censura_nro') === 'true';
      if (localStorage.getItem('censura_ceco') !== null) chkCeco.checked = localStorage.getItem('censura_ceco') === 'true';
      if (localStorage.getItem('censura_iban') !== null) chkIban.checked = localStorage.getItem('censura_iban') === 'true';
    });

    textosExtra.addEventListener('input', () => localStorage.setItem('censura_textos', textosExtra.value));
    chkDni.addEventListener('change', () => localStorage.setItem('censura_dni', chkDni.checked));
    chkCif.addEventListener('change', () => localStorage.setItem('censura_cif', chkCif.checked));
    chkTrabajador.addEventListener('change', () => localStorage.setItem('censura_trabajador', chkTrabajador.checked));
    chkAfiliacion.addEventListener('change', () => localStorage.setItem('censura_afiliacion', chkAfiliacion.checked));
    chkInscripcion.addEventListener('change', () => localStorage.setItem('censura_inscripcion', chkInscripcion.checked));
    chkNro.addEventListener('change', () => localStorage.setItem('censura_nro', chkNro.checked));
    chkCeco.addEventListener('change', () => localStorage.setItem('censura_ceco', chkCeco.checked));
    chkIban.addEventListener('change', () => localStorage.setItem('censura_iban', chkIban.checked));

    // Palabras protegidas: jamás se deben censurar
    const PALABRAS_PROTEGIDAS = [
      'cuantia', 'cuantía', 'precio', 'concepto', 'devengos', 'deducciones',
      'tarifa', 'categoria', 'categoría', 'antigüedad', 'antiguedad',
      'periodo', 'period', 'tot.días', 'tot.dias', 'dias', 'días',
      'base', 'cotizacion', 'cotización', 'irpf', 'liquido', 'líquido',
      'total', 'remuneracion', 'remuneración', 'horas', 'retencion', 'retención',
      'empresa', 'domicilio', 'trabajador', 'd.n.i.', 'dni'
    ];

    function esPalabraProtegida(texto) {
      const limpio = texto.toLowerCase().replace(/[^a-záéíóúñ0-9]/g, '');
      return PALABRAS_PROTEGIDAS.some(p => {
        const pLimpia = p.replace(/[^a-záéíóúñ0-9]/g, '');
        return limpio === pLimpia;
      });
    }

    // Censura estrictamente la celda de la fila siguiente (máximo 32px de caída)
    function censurarDebajoDeCabecera(patronCabecera, items, anchoMaxCol = 320, maxAlt = 32) {
      const indices = [];
      for (let i = 0; i < items.length; i++) {
        const cab = items[i];
        if (patronCabecera.test(cab.strLower)) {
          // Encuentra el límite derecho con la siguiente columna
          let xMaxCol = cab.x + anchoMaxCol;
          for (let j = 0; j < items.length; j++) {
            if (i === j) continue;
            const otro = items[j];
            if (!otro.strTrimmed) continue;
            if (Math.abs(otro.y - cab.y) < 18 && otro.x > cab.x + 15) {
              if (otro.x < xMaxCol) {
                xMaxCol = otro.x - 4;
              }
            }
          }

          // Zona vertical exclusiva de la celda de valor
          const yMin = cab.y + 4;
          const yMax = cab.y + maxAlt;
          const xMin = Math.max(0, cab.x - 10);

          for (let k = 0; k < items.length; k++) {
            if (k === i) continue;
            const cand = items[k];
            if (!cand.strTrimmed) continue;

            if (esPalabraProtegida(cand.strLower)) continue;

            const candCenterX = cand.x + cand.w / 2;
            const candCenterY = cand.y + cand.h / 2;

            if (candCenterY >= yMin && candCenterY <= yMax &&
                candCenterX >= xMin && candCenterX <= xMaxCol) {
              indices.push(cand.idx);
            }
          }
        }
      }
      return indices;
    }

    inputPdf.addEventListener('change', async (e) => {
      const archivo = e.target.files[0];
      if (!archivo) return;

      estado.style.color = '#2563eb';
      estado.innerText = "Cargando documento...";

      const lineasTextoManuales = textosExtra.value
        .split('\n')
        .map(t => t.trim())
        .filter(t => t.length > 0);

      try {
        const buffer = await archivo.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        const totalPaginas = pdf.numPages;

        const { jsPDF } = window.jspdf;
        let salidaPdf = null;

        for (let num = 1; num <= totalPaginas; num++) {
          estado.innerText = `Anonimizando página ${num} de ${totalPaginas}...`;
          const pagina = await pdf.getPage(num);
          
          const viewport = pagina.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await pagina.render({ canvasContext: ctx, viewport: viewport }).promise;

          const contenidoTexto = await pagina.getTextContent();
          
          const items = contenidoTexto.items.map((item, idx) => {
            const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
            const w = item.width * 2.0;
            const h = (item.height || 10) * 2.0;
            return {
              idx,
              rawItem: item,
              str: item.str,
              strTrimmed: item.str.trim(),
              strLower: item.str.toLowerCase().trim(),
              x: tx[4],
              y: tx[5] - h,
              w,
              h
            };
          });

          const indicesACensurar = new Set();

          // 1. Textos manuales
          for (const item of items) {
            for (const palabra of lineasTextoManuales) {
              if (item.strLower.includes(palabra.toLowerCase())) {
                indicesACensurar.add(item.idx);
              }
            }
          }

          // 2. DNI / NIE numérico
          if (chkDni.checked) {
            const regexDni = /\b\d{8}[A-HJ-NP-TV-Z]\b|\b[XYZ]\d{7}[A-HJ-NP-TV-Z]\b/i;
            for (const item of items) {
              if (regexDni.test(item.str)) indicesACensurar.add(item.idx);
            }
          }

          // 3. CIF / NIF de Empresa
          if (chkCif.checked) {
            const regexCif = /\b[A-HJ-NP-SUVW]\d{7}[0-9A-J]\b/i;
            for (let i = 0; i < items.length; i++) {
              const item = items[i];
              if (regexCif.test(item.str)) {
                indicesACensurar.add(item.idx);
              }
              if (item.strLower.includes("cif") || item.strLower.includes("nif/cif") || item.strLower.includes("c.i.f")) {
                indicesACensurar.add(item.idx);
                if (i + 1 < items.length && regexCif.test(items[i + 1].str)) {
                  indicesACensurar.add(items[i + 1].idx);
                }
              }
            }
          }

          // 4. IBAN bancario
          if (chkIban.checked) {
            const regexIban = /\bES\d{2}[ -]?(?:\d{4}[ -]?){5}\b/i;
            for (const item of items) {
              if (regexIban.test(item.str)) indicesACensurar.add(item.idx);
            }
          }

          // 5. Trabajador: patrón APELLIDOS, NOMBRE + búsqueda inmediata
          if (chkTrabajador.checked) {
            const regexNombre = /\b[A-ZÁÉÍÓÚÑ]{2,}(?:\s+[A-ZÁÉÍÓÚÑ]{2,})*,\s*[A-ZÁÉÍÓÚÑ]{2,}\b/;
            for (const item of items) {
              if (item.y < viewport.height * 0.40 && regexNombre.test(item.str)) {
                indicesACensurar.add(item.idx);
              }
            }
            const patronTrabajador = /\b(trabajador|empleado|apellidos\s*y\s*nombre)\b/i;
            censurarDebajoDeCabecera(patronTrabajador, items, 300, 32).forEach(idx => indicesACensurar.add(idx));
          }

          // 6. Nº Afiliación S.S.
          if (chkAfiliacion.checked) {
            const regexNaf = /\b\d{2}[\s\/\.\-]?\d{8}[\s\/\.\-]?\d{2}\b|\b\d{12}\b/;
            for (const item of items) {
              if (regexNaf.test(item.str)) indicesACensurar.add(item.idx);
            }
            const patronAfil = /\b(afiliaci[oó]n|n\.?a\.?f|n[ºoúum\.]*\s*s\.?s)\b/i;
            censurarDebajoDeCabecera(patronAfil, items, 140, 32).forEach(idx => indicesACensurar.add(idx));
          }

          // 7. Nº Inscripción S.S. (C.C.C.)
          if (chkInscripcion.checked) {
            const regexCcc = /\b\d{2}[\s\/\.\-]?\d{7,9}[\s\/\.\-]?\d{2}\b|\b\d{11}\b/;
            for (const item of items) {
              if (regexCcc.test(item.str)) indicesACensurar.add(item.idx);
            }
            const patronInsc = /\b(inscripci[oó]n|c\.?c\.?c|cta\.?\s*cotiz)\b/i;
            censurarDebajoDeCabecera(patronInsc, items, 180, 32).forEach(idx => indicesACensurar.add(idx));
          }

          // 8. Nº Empleado / Matrícula (NRO.)
          if (chkNro.checked) {
            const patronNro = /\b(nro\.?|matr[ií]cula|n[ºo]\s*empleado)\b/i;
            censurarDebajoDeCabecera(patronNro, items, 90, 32).forEach(idx => indicesACensurar.add(idx));
          }

          // 9. Centro de Coste (CECO)
          if (chkCeco.checked) {
            const patronCeco = /\b(ceco|c\.?c\.?|centro\s*coste)\b/i;
            censurarDebajoDeCabecera(patronCeco, items, 90, 32).forEach(idx => indicesACensurar.add(idx));
          }

          // Filtro de seguridad final: desmarcar cualquier palabra protegida
          for (const idx of Array.from(indicesACensurar)) {
            if (esPalabraProtegida(items[idx].strLower)) {
              indicesACensurar.delete(idx);
            }
          }

          // Aplicar recuadros negros
          ctx.fillStyle = '#000000';
          for (const idx of indicesACensurar) {
            const item = items[idx];
            ctx.fillRect(item.x - 2, item.y - 2, item.w + 4, item.h + 5);
          }

          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          const orientation = viewport.width > viewport.height ? 'l' : 'p';

          if (num === 1) {
            salidaPdf = new jsPDF({
              orientation: orientation,
              unit: 'px',
              format: [viewport.width, viewport.height]
            });
          } else {
            salidaPdf.addPage([viewport.width, viewport.height], orientation);
          }

          salidaPdf.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height);
        }

        estado.style.color = '#10b981';
        estado.innerText = "¡Completado! Descargando archivo limpio...";
        salidaPdf.save(`anonimizada_${archivo.name}`);
      } catch (err) {
        console.error(err);
        estado.style.color = '#ef4444';
        estado.innerText = "Error al procesar el archivo.";
      }
    });
  </script>
</body>
</html>
