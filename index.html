<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anonimizador Nómina</title>
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #2563eb;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: #3f3f46;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      text-align: center;
    }
    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 15px;
      margin-bottom: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #252528;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .checkbox-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }
    textarea {
      width: 100%;
      background: #252528;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 0.9rem;
      box-sizing: border-box;
      resize: vertical;
    }
    .upload-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
    }
    input[type="file"] {
      display: none;
    }
    #estado {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #10b981;
      text-align: center;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Configurar Censura de Nómina</h1>

    <div class="section-title">Datos automáticos a tapar:</div>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chkDni" checked> DNI / NIE
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkTrabajador" checked> Trabajador (Nombre y Apellidos)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkAfiliacion" checked> Nº Afiliación S.S. (Trabajador)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkInscripcion" checked> Nº Inscripción S.S. (C.C.C. Empresa)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkIban" checked> Cuenta Bancaria (IBAN)
      </label>
    </div>

    <div class="section-title">Textos adicionales específicos (opcional):</div>
    <textarea id="textosExtra" rows="3" placeholder="Tu calle o cualquier otro dato personal..."></textarea>

    <label class="upload-btn" for="inputPdf">
      Seleccionar Nómina y Anonimizar
    </label>
    <input type="file" id="inputPdf" accept="application/pdf">

    <div id="estado"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const inputPdf = document.getElementById('inputPdf');
    const estado = document.getElementById('estado');
    const textosExtra = document.getElementById('textosExtra');
    const chkDni = document.getElementById('chkDni');
    const chkTrabajador = document.getElementById('chkTrabajador');
    const chkAfiliacion = document.getElementById('chkAfiliacion');
    const chkInscripcion = document.getElementById('chkInscripcion');
    const chkIban = document.getElementById('chkIban');

    // Cargar preferencias guardadas
    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('censura_textos') !== null) textosExtra.value = localStorage.getItem('censura_textos');
      if (localStorage.getItem('censura_dni') !== null) chkDni.checked = localStorage.getItem('censura_dni') === 'true';
      if (localStorage.getItem('censura_trabajador') !== null) chkTrabajador.checked = localStorage.getItem('censura_trabajador') === 'true';
      if (localStorage.getItem('censura_afiliacion') !== null) chkAfiliacion.checked = localStorage.getItem('censura_afiliacion') === 'true';
      if (localStorage.getItem('censura_inscripcion') !== null) chkInscripcion.checked = localStorage.getItem('censura_inscripcion') === 'true';
      if (localStorage.getItem('censura_iban') !== null) chkIban.checked = localStorage.getItem('censura_iban') === 'true';
    });

    // Guardar cambios al tocar las casillas
    textosExtra.addEventListener('input', () => localStorage.setItem('censura_textos', textosExtra.value));
    chkDni.addEventListener('change', () => localStorage.setItem('censura_dni', chkDni.checked));
    chkTrabajador.addEventListener('change', () => localStorage.setItem('censura_trabajador', chkTrabajador.checked));
    chkAfiliacion.addEventListener('change', () => localStorage.setItem('censura_afiliacion', chkAfiliacion.checked));
    chkInscripcion.addEventListener('change', () => localStorage.setItem('censura_inscripcion', chkInscripcion.checked));
    chkIban.addEventListener('change', () => localStorage.setItem('censura_iban', chkIban.checked));

    inputPdf.addEventListener('change', async (e) => {
      const archivo = e.target.files[0];
      if (!archivo) return;

      estado.style.color = '#2563eb';
      estado.innerText = "Cargando documento...";

      const lineasTextoManuales = textosExtra.value
        .split('\n')
        .map(t => t.trim())
        .filter(t => t.length > 0);

      try {
        const buffer = await archivo.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        const totalPaginas = pdf.numPages;

        const { jsPDF } = window.jspdf;
        let salidaPdf = null;

        for (let num = 1; num <= totalPaginas; num++) {
          estado.innerText = `Anonimizando página ${num} de ${totalPaginas}...`;
          const pagina = await pdf.getPage(num);
          
          const viewport = pagina.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await pagina.render({ canvasContext: ctx, viewport: viewport }).promise;

          const contenidoTexto = await pagina.getTextContent();
          const items = contenidoTexto.items;
          const indicesACensurar = new Set();

          // 1. Textos manuales introducidos por el usuario
          for (let i = 0; i < items.length; i++) {
            const strLower = items[i].str.toLowerCase();
            for (const palabra of lineasTextoManuales) {
              if (strLower.includes(palabra.toLowerCase())) {
                indicesACensurar.add(i);
              }
            }
          }

          // 2. DNI / NIE por formato
          if (chkDni.checked) {
            const regexDni = /\b\d{8}[A-HJ-NP-TV-Z]\b|\b[XYZ]\d{7}[A-HJ-NP-TV-Z]\b/i;
            for (let i = 0; i < items.length; i++) {
              if (regexDni.test(items[i].str)) indicesACensurar.add(i);
            }
          }

          // 3. IBAN bancario por formato
          if (chkIban.checked) {
            const regexIban = /\bES\d{2}[ -]?(?:\d{4}[ -]?){5}\b/i;
            for (let i = 0; i < items.length; i++) {
              if (regexIban.test(items[i].str)) indicesACensurar.add(i);
            }
          }

          // 4. Trabajador (etiqueta y nombre continuo)
          if (chkTrabajador.checked) {
            for (let i = 0; i < items.length; i++) {
              const strLower = items[i].str.toLowerCase().trim();
              if (strLower.includes("trabajador") || strLower.includes("apellidos y nombre") || strLower.includes("empleado")) {
                indicesACensurar.add(i);

                // Revisa los elementos siguientes donde suele aparecer el nombre
                const posY = items[i].transform[5];
                for (let k = i + 1; k < Math.min(i + 6, items.length); k++) {
                  const textoSiguiente = items[k].str.trim();
                  const textoSiguienteLower = textoSiguiente.toLowerCase();
                  if (!textoSiguiente) continue;

                  // Se detiene si llega a otro campo contable o identificador
                  const esOtroCampo = ['nif', 'dni', 'cif', 'categor', 'grupo', 'antig', 'secc', 'puesto', 'fecha', 'períod', 'period', 'matríc', 'c.c.c', 'afiliac', 'inscrip', 'base', 'devengo', 'total'].some(c => textoSiguienteLower.includes(c));
                  if (esOtroCampo) break;

                  // Si está en la misma línea o inmediatamente debajo
                  if (Math.abs(items[k].transform[5] - posY) < 26) {
                    indicesACensurar.add(k);
                  } else {
                    break;
                  }
                }
              }
            }
          }

          // 5. Nº Afiliación S.S. (Trabajador / NAF)
          if (chkAfiliacion.checked) {
            const regexNaf = /\b\d{2}[ -./]?\d{8}[ -./]?\d{2}\b|\b\d{12}\b/;
            for (let i = 0; i < items.length; i++) {
              const str = items[i].str;
              const strLower = str.toLowerCase();

              // Por formato de 12 dígitos
              if (regexNaf.test(str)) indicesACensurar.add(i);

              // Por etiqueta
              if (strLower.includes("afiliaci") || strLower.includes("n.a.f") || strLower.includes("nº s.s") || strLower.includes("núm. s.s") || strLower.includes("num. s.s")) {
                indicesACensurar.add(i);
                for (let k = i + 1; k < Math.min(i + 3, items.length); k++) {
                  if (/\d/.test(items[k].str)) {
                    indicesACensurar.add(k);
                    break;
                  }
                }
              }
            }
          }

          // 6. Nº de Inscripción S.S. (C.C.C. Patronal / Empresa)
          if (chkInscripcion.checked) {
            const regexCcc = /\b\d{2}[ -./]?(?:\d{7}|\d{8}|\d{9})[ -./]?\d{2}\b|\b\d{11}\b/;
            for (let i = 0; i < items.length; i++) {
              const str = items[i].str;
              const strLower = str.toLowerCase();

              // Por formato de 11 dígitos
              if (regexCcc.test(str)) indicesACensurar.add(i);

              // Por etiqueta
              if (strLower.includes("inscripci") || strLower.includes("c.c.c") || strLower.includes("cta. cotiz")) {
                indicesACensurar.add(i);
                for (let k = i + 1; k < Math.min(i + 3, items.length); k++) {
                  if (/\d/.test(items[k].str)) {
                    indicesACensurar.add(k);
                    break;
                  }
                }
              }
            }
          }

          // Dibujar cajas negras sobre los elementos seleccionados
          ctx.fillStyle = '#000000';
          for (const idx of indicesACensurar) {
            const item = items[idx];
            const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
            const x = tx[4];
            const y = tx[5] - (item.height * 2.0);
            const w = item.width * 2.0;
            const h = item.height * 2.5;

            ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
          }

          // Renderizar en el nuevo PDF
          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          const orientation = viewport.width > viewport.height ? 'l' : 'p';

          if (num === 1) {
            salidaPdf = new jsPDF({
              orientation: orientation,
              unit: 'px',
              format: [viewport.width, viewport.height]
            });
          } else {
            salidaPdf.addPage([viewport.width, viewport.height], orientation);
          }

          salidaPdf.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height);
        }

        estado.style.color = '#10b981';
        estado.innerText = "¡Completado! Descargando archivo limpio...";
        salidaPdf.save(`anonimizada_${archivo.name}`);
      } catch (err) {
        console.error(err);
        estado.style.color = '#ef4444';
        estado.innerText = "Error al procesar el archivo.";
      }
    });
  </script>
</body>
</html>
