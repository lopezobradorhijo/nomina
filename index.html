<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Anonimizador Nómina</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --primary: #2563eb;
      --text: #ffffff;
      --text-muted: #9ca3af;
      --border: #3f3f46;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      min-height: 100vh;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }
    h1 {
      font-size: 1.25rem;
      margin-top: 0;
      text-align: center;
    }
    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-top: 15px;
      margin-bottom: 8px;
    }
    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #252528;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .checkbox-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
    }
    textarea {
      width: 100%;
      background: #252528;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 10px;
      font-size: 0.9rem;
      box-sizing: border-box;
      resize: vertical;
    }
    .upload-btn {
      display: block;
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      background: var(--primary);
      color: white;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      box-sizing: border-box;
    }
    input[type="file"] {
      display: none;
    }
    #estado {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #10b981;
      text-align: center;
      white-space: pre-line;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Configurar Censura de Nómina</h1>

    <div class="section-title">Patrones automáticos a tapar:</div>
    <div class="checkbox-group">
      <label class="checkbox-label">
        <input type="checkbox" id="chkDni" checked> DNI / NIE
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkIban" checked> Cuenta Bancaria (IBAN)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkSs" checked> Nº Seguridad Social (NAF)
      </label>
    </div>

    <div class="section-title">Nombres o textos manuales (uno por línea):</div>
    <textarea id="textosExtra" rows="4" placeholder="Tu Nombre y Apellidos&#10;Tu Calle o Dirección&#10;Cualquier otro dato"></textarea>

    <label class="upload-btn" for="inputPdf">
      Seleccionar Nómina y Anonimizar
    </label>
    <input type="file" id="inputPdf" accept="application/pdf">

    <div id="estado"></div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const inputPdf = document.getElementById('inputPdf');
    const estado = document.getElementById('estado');
    const textosExtra = document.getElementById('textosExtra');
    const chkDni = document.getElementById('chkDni');
    const chkIban = document.getElementById('chkIban');
    const chkSs = document.getElementById('chkSs');

    window.addEventListener('DOMContentLoaded', () => {
      const guardadoTexto = localStorage.getItem('censura_textos');
      if (guardadoTexto !== null) textosExtra.value = guardadoTexto;

      if (localStorage.getItem('censura_dni') !== null) {
        chkDni.checked = localStorage.getItem('censura_dni') === 'true';
      }
      if (localStorage.getItem('censura_iban') !== null) {
        chkIban.checked = localStorage.getItem('censura_iban') === 'true';
      }
      if (localStorage.getItem('censura_ss') !== null) {
        chkSs.checked = localStorage.getItem('censura_ss') === 'true';
      }
    });

    textosExtra.addEventListener('input', () => localStorage.setItem('censura_textos', textosExtra.value));
    chkDni.addEventListener('change', () => localStorage.setItem('censura_dni', chkDni.checked));
    chkIban.addEventListener('change', () => localStorage.setItem('censura_iban', chkIban.checked));
    chkSs.addEventListener('change', () => localStorage.setItem('censura_ss', chkSs.checked));

    inputPdf.addEventListener('change', async (e) => {
      const archivo = e.target.files[0];
      if (!archivo) return;

      estado.style.color = '#3b82f6';
      estado.innerText = "Cargando documento...";

      const patronesActivos = [];
      if (chkDni.checked) {
        patronesActivos.push(/\b\d{8}[A-HJ-NP-TV-Z]\b/gi, /\b[XYZ]\d{7}[A-HJ-NP-TV-Z]\b/gi);
      }
      if (chkIban.checked) {
        patronesActivos.push(/\bES\d{2}[ -]?(?:\d{4}[ -]?){5}\b/gi);
      }
      if (chkSs.checked) {
        patronesActivos.push(/\b\d{2}[ -]?\d{8}[ -]?\d{2}\b/g, /\b\d{12}\b/g);
      }

      const lineasTexto = textosExtra.value
        .split('\n')
        .map(t => t.trim())
        .filter(t => t.length > 0);

      try {
        const buffer = await archivo.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
        const totalPaginas = pdf.numPages;

        const { jsPDF } = window.jspdf;
        let salidaPdf = null;

        for (let num = 1; num <= totalPaginas; num++) {
          estado.innerText = `Anonimizando página ${num} de ${totalPaginas}...`;
          const pagina = await pdf.getPage(num);
          
          const viewport = pagina.getViewport({ scale: 2.0 });
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.width = viewport.width;
          canvas.height = viewport.height;

          await pagina.render({ canvasContext: ctx, viewport: viewport }).promise;

          const contenidoTexto = await pagina.getTextContent();
          ctx.fillStyle = '#000000';

          for (const item of contenidoTexto.items) {
            const str = item.str;
            let censurar = false;

            for (const palabra of lineasTexto) {
              if (str.toLowerCase().includes(palabra.toLowerCase())) {
                censurar = true;
                break;
              }
            }

            if (!censurar) {
              for (const patron of patronesActivos) {
                if (patron.test(str)) {
                  censurar = true;
                  break;
                }
              }
            }

            if (censurar) {
              const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
              const x = tx[4];
              const y = tx[5] - (item.height * 2.0);
              const w = item.width * 2.0;
              const h = item.height * 2.5;

              ctx.fillRect(x - 2, y - 2, w + 4, h + 4);
            }
          }

          const imgData = canvas.toDataURL('image/jpeg', 0.95);
          const orientation = viewport.width > viewport.height ? 'l' : 'p';

          if (num === 1) {
            salidaPdf = new jsPDF({
              orientation: orientation,
              unit: 'px',
              format: [viewport.width, viewport.height]
            });
          } else {
            salidaPdf.addPage([viewport.width, viewport.height], orientation);
          }

          salidaPdf.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height);
        }

        estado.style.color = '#10b981';
        estado.innerText = "¡Completado! Descargando archivo limpio...";
        salidaPdf.save(`anonimizada_${archivo.name}`);
      } catch (err) {
        console.error(err);
        estado.style.color = '#ef4444';
        estado.innerText = "Error al procesar el archivo.";
      }
    });
  </script>
</body>
</html>
